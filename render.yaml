services:
  - type: web
    name: crypto-macro-whale-tracker
    env: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python tracker.py
    healthCheckPath: /health
    envVars:
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_CHAT_ID
        sync: false
      - key: WHALE_ALERT_API_KEY
        sync: false
      - key: POLL_INTERVAL_SEC
        value: 600
